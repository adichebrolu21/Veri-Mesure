<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img" aria-label="full perimeter reference">
  <line x1="230.0" y1="8" x2="230.0" y2="242" stroke="#1F3D43" stroke-width="1"/>

  <g transform="translate(0,0)">
    <text x="12" y="20" fill="#7E9AA0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">what it means</text>
    <path d="M 36 62 C 56 48 80 40 94 38 L 166 38 C 180 40 204 48 224 62 L 214 96 L 198 88 L 198 190 C 172 196 88 196 62 190 L 62 88 L 46 96 Z" fill="#E8EDE9" fill-opacity="0.09" stroke="#E8A33D" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 108 38 C 108 76 120 94 130 94 C 140 94 152 76 152 38" fill="none" stroke="#E8EDE9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="130" y1="44" x2="130" y2="186" stroke="#E8EDE9" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <rect x="125" y="33" width="10" height="7" rx="1.5" fill="#F2C230"/>
    <rect x="125" y="191" width="10" height="7" rx="1.5" fill="#F2C230"/>
    <text x="142" y="208" fill="#E8EDE9" font-family="system-ui,sans-serif" font-size="10">clip</text>
    <text x="142" y="30" fill="#E8EDE9" font-family="system-ui,sans-serif" font-size="10">clip</text>
    <text x="12" y="226" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">the whole outer edge, corners sharp,</text>
    <text x="12" y="240" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">added up from two halves at the clips</text>
  </g>

  <g transform="translate(230.0,0)">
    <text x="12" y="20" fill="#7E9AA0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">how to present it</text>
    <rect x="13" y="34" width="204" height="136" fill="none" stroke="#5A7C82" stroke-width="1"/>
    <path d="M 22.9 169.9 L 23.4 159 Q 23.4 145 17.9 133 L 30.2 96.1 L 60.9 42.8 L 102.2 63.8 L 80.8 85.1 L 212.1 86 L 212.1 169.9 Z" fill="#E8EDE9" fill-opacity="0.09" stroke="#E8EDE9" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="13" y="153.5" width="204" height="12.3" fill="#5AB98A" fill-opacity="0.25" stroke="#5AB98A" stroke-width="1"/>
    <rect x="20" y="156" width="8" height="6" rx="1.5" fill="#F2C230"/>
    <rect x="207.5" y="156" width="8" height="6" rx="1.5" fill="#F2C230"/>
    <path d="M 22.9 170 L 17.9 186 L 21 196 M 212.1 170 L 212.1 196" fill="none" stroke="#E8EDE9" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 3"/>
    <text x="115" y="188" fill="#7E9AA0" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">other half flat past the edge</text>
    <text x="12" y="226" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">one half in view, both clips in the band;</text>
    <text x="12" y="240" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">then lift it, turn it end for end, lay again</text>
  </g>
</svg>
