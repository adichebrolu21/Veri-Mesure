<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img" aria-label="neckline reference">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E8A33D"/></marker>
  </defs>
  <line x1="230.0" y1="8" x2="230.0" y2="242" stroke="#1F3D43" stroke-width="1"/>

  <g transform="translate(0,0)">
    <text x="12" y="20" fill="#7E9AA0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">what it means</text>
    <path d="M 78 34 C 90 26 104 22 115 21 C 122 31 134 37 147 37 C 160 37 172 31 179 21 C 190 22 204 26 216 34 L 236 62 L 212 82 L 202 71 L 202 172 C 178 178 116 178 92 172 L 92 71 L 82 82 L 58 62 Z" fill="#E8EDE9" fill-opacity="0.09" stroke="#E8EDE9" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 115 21 C 122 31 134 37 147 37 C 160 37 172 31 179 21" fill="none" stroke="#E8A33D" stroke-width="2.6" stroke-linecap="round" marker-start="url(#b)" marker-end="url(#a)"/>
    <circle cx="115" cy="21" r="2.6" fill="#E8A33D"/>
    <circle cx="179" cy="21" r="2.6" fill="#E8A33D"/>
    <text x="147.0" y="58.0" fill="#E8EDE9" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">neckline seam</text>
    <text x="12" y="226" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">along the collar seam, shoulder point to shoulder point</text>
    <text x="12" y="240" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">the shirt lies flat: nothing is folded for this one</text>
  </g>

  <g transform="translate(230.0,0)">
    <text x="12" y="20" fill="#7E9AA0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">how to present it</text>
    <path d="M 44 62 C 58 46 76 38 90 36 C 98 52 114 60 130 60 C 146 60 162 52 170 36 C 184 38 202 46 216 62 L 206 96 L 190 88 L 190 196 C 160 202 100 202 70 196 L 70 88 L 54 96 Z" fill="#E8EDE9" fill-opacity="0.09" stroke="#E8EDE9" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 90 36 C 98 52 114 60 130 60 C 146 60 162 52 170 36" fill="none" stroke="#E8A33D" stroke-width="3.2" stroke-linecap="round"/>

    <circle cx="90" cy="36" r="6" fill="none" stroke="#E8EDE9" stroke-width="1.6"/>
    <circle cx="90" cy="36" r="2.4" fill="#E8EDE9"/>
    <text x="90" y="26" fill="#E8EDE9" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">1</text>

    <circle cx="130" cy="60" r="6" fill="none" stroke="#E8EDE9" stroke-width="1.6"/>
    <circle cx="130" cy="60" r="2.4" fill="#E8EDE9"/>
    <text x="130" y="79" fill="#E8EDE9" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">2</text>

    <circle cx="170" cy="36" r="6" fill="none" stroke="#E8EDE9" stroke-width="1.6"/>
    <circle cx="170" cy="36" r="2.4" fill="#E8EDE9"/>
    <text x="170" y="26" fill="#E8EDE9" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">3</text>

    <text x="12" y="226" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">three points: one end, the middle, the other end</text>
    <text x="12" y="240" fill="#5A7C82" font-family="system-ui,sans-serif" font-size="10">near enough is near enough - the machine finds the seam</text>
  </g>
</svg>
